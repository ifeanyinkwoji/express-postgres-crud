name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# Grant the workflow write permissions so it can commit the coverage badge directly
permissions:
  contents: write

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: crud_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crud_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite with coverage
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres_password
          DB_NAME: crud_db_test
          DB_PORT: 5432
        run: npm test

      - name: Generate Dynamic Coverage Badges
        # Only run on pushes to your main branch to keep metrics accurate
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: jaywcjlove/generated-badges-action@v2.0.2
        with:
          label: Coverage
          # Reads the statement coverage metrics generated by your test command
          output: badges/coverage.svg
          source: coverage/coverage-summary.json
          query: total.statements.pct

      - name: Upload coverage reports to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7
